######################## default configuration ####################
# The base URL of your site. Local file-served convention is "/";
# the gh-pages workflow overrides this with --baseURL at build time.
baseURL = "/"
languageCode = "en-GB"
title = "Dr. Hughes"
theme = "hugo-paper"
copyright = "© 2026 Dr. Hughes"
timeZone = "Europe/London"
summaryLength = 10
enableEmoji = true
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# Content lives under content/english (carried over from languages.toml).
contentDir = "content/english"

########################## Permalinks ############################
[permalinks.page]
"pages" = "/:slugorcontentbasename/"

############################# Outputs ############################
[outputs]
home = ["HTML", "RSS"]

############################ Markup ##############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'nord'
noClasses = false

########################### Params ###############################
[params]
# "light" gives the theme's plain white page background (#fff).
color = "light"
description = "Teacher, scientist and all-round nerd. Computer Science and Maths teaching resources, plus research in computational biology."
author = "Dr. Hughes"
name = "Dr. Hughes"
github = "Dr-Hughes"
disablePostNavigation = true

########################### Menus ###############################
[[menu.main]]
name = "About"
url = "/about/"
weight = 1

[[menu.main]]
name = "Teaching"
url = "/teaching/"
weight = 2

[[menu.main]]
name = "Research"
url = "/research/"
weight = 3

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 4
