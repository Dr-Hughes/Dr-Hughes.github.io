{{ define "main" }}
  <section class="home-hero">
    <div class="avatar-ring">
      <img src="{{ partial "siteurl.html" (dict "u" "/images/me.jpg" "p" $) }}" alt="Photo of {{ site.Params.name }}" width="144" height="144">
    </div>
    <div>
      <h1 class="home-name">{{ site.Params.name }}</h1>
      {{ with .Params.tagline }}<p class="home-tagline">{{ . }}</p>{{ end }}
    </div>
  </section>

  <section class="home-intro">{{ .Content }}</section>

  <section class="home-cards" aria-label="Sections">
    {{ range .Params.cards }}
      <a class="home-card accent-{{ .accent }}" href="{{ partial "siteurl.html" (dict "u" .link "p" $) }}">
        <h2>{{ .title }}</h2>
        <p>{{ .text }}</p>
      </a>
    {{ end }}
  </section>
{{ end }}
